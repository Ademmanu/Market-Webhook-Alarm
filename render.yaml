services:
  - type: web
    name: market-webhook-monitor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: POLL_SECONDS
        value: 2
      - key: QUOTE_MAX_AGE_SECONDS
        value: 30
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false

      - key: RESET_DATABASE_ON_START
        value: false
