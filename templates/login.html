{% extends 'base.html' %}{% block content %}<div class="panel loginbox"><div class="brand"><div class="brandmark">M</div><div><h1>Welcome back</h1><div class="muted">Sign in to your market alerts</div></div></div><form method="post" style="margin-top:22px"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div style="margin-bottom:13px"><label>Username</label><input name="username" required autocomplete="username"></div><div style="margin-bottom:16px"><label>Password</label><div class="password-wrap"><input id="loginPassword" type="password" name="password" required autocomplete="current-password"><button class="password-toggle" type="button" data-toggle="loginPassword">Show</button></div></div><button style="width:100%">Sign in</button></form><p class="muted" style="margin-top:16px">Need an account? <a href="/signup" style="color:var(--blue)">Create one</a></p></div>{% endblock %}
{% block scripts %}<script>document.querySelectorAll('[data-toggle]').forEach(button=>button.addEventListener('click',()=>{const input=document.getElementById(button.dataset.toggle);const show=input.type==='password';input.type=show?'text':'password';button.textContent=show?'Hide':'Show';}));</script>{% endblock %}
