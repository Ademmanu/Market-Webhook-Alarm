<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Market Webhook Monitor' }}</title>
<style>
:root{color-scheme:dark;--bg:#0b1017;--panel:#121b27;--panel2:#172333;--line:#28384a;--muted:#91a0b2;--text:#edf3fa;--blue:#55a6ff;--green:#38c98b;--red:#ff7272;--amber:#f3bd58}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#14243a 0,#0b1017 52%);color:var(--text);font:14px Inter,system-ui,Arial,sans-serif}main{max-width:1180px;margin:28px auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.brandmark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#1b8bff,#31d5a0);display:grid;place-items:center;font-weight:900;color:#04111d;font-size:20px}h1{font-size:23px;margin:0;letter-spacing:-.4px}h2{font-size:16px;margin:0 0 14px}.muted{color:var(--muted);font-size:12px}.panel{background:linear-gradient(180deg,#142131,#111a25);border:1px solid var(--line);border-radius:15px;padding:18px;margin:16px 0;box-shadow:0 12px 32px #0002}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.stat{background:#111c29;border:1px solid var(--line);border-radius:12px;padding:13px}.stat .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px}.stat .v{font-size:22px;font-weight:750;margin-top:5px}.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:99px;font-size:11px;background:#26384b;color:#c7d9ed}.dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.dot.bad{background:var(--red)}label{display:block;color:#bdc9d7;font-size:12px;margin:0 0 6px}input,select{width:100%;background:#0a121d;color:var(--text);border:1px solid #34485e;border-radius:9px;padding:10px 11px;font-size:13px;outline:none}input:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 2px #55a6ff20}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wide{grid-column:1/-1}.btn,button{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:8px;background:#1879d3;color:white;padding:9px 12px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none}.btn.secondary,button.secondary{background:#2a394a;color:#dbe7f5}.btn.danger,button.danger{background:#8d3038}.btn.ghost,button.ghost{background:transparent;border:1px solid var(--line);color:#d8e4f2}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.inline{display:inline}.flash{padding:11px 13px;border-radius:9px;margin:10px 0;background:#183d32;border:1px solid #286c51}.flash.error{background:#40252a;border-color:#753a43}.flash.warning{background:#3a3221;border-color:#76602d}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #283747;font-size:12px;vertical-align:middle}th{color:var(--muted);font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px}.badge{padding:4px 8px;border-radius:30px;background:#23394c;color:#bcdcff;font-size:10px}.badge.good{background:#173c31;color:#8ee4bc}.badge.bad{background:#44272d;color:#ff9b9b}.badge.warn{background:#46381f;color:#ffd887}.symbolbox{position:relative}.suggestions{position:absolute;z-index:20;top:100%;left:0;right:0;max-height:240px;overflow:auto;background:#0c1622;border:1px solid #3a536d;border-radius:9px;margin-top:4px;box-shadow:0 10px 24px #0008}.suggestions button{display:flex;justify-content:space-between;width:100%;background:transparent;color:#e9f2fc;border-radius:0;padding:9px 11px;text-align:left}.suggestions button:hover{background:#1c3147}.suggestions small{color:#8ea2b9;font-weight:400}.empty{color:var(--muted);padding:12px;font-size:12px}.subhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.help{font-size:11px;color:var(--muted);line-height:1.5}.loginbox{max-width:440px;margin:10vh auto}.price{font-variant-numeric:tabular-nums;font-weight:700}.bar{height:6px;background:#223246;border-radius:10px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green)}.tablewrap{overflow-x:auto}.smallform{display:inline}.checkrow{display:flex;align-items:center;gap:8px}.checkrow input{width:auto}.sectiongap{margin-top:24px}.password-wrap{display:flex;gap:7px;align-items:stretch}.password-wrap input{flex:1;min-width:0}.password-toggle{min-width:58px;background:#2a394a;color:#dbe7f5;border:1px solid #34485e;padding:8px 10px}
@media(max-width:760px){main{margin:16px auto}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.top h1{font-size:19px}.tablewrap{margin:0 -6px}th,td{padding:9px 7px} .hide-mobile{display:none}}
</style></head><body><main>
{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{category}}">{{message}}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main>{% block scripts %}{% endblock %}</body></html>
