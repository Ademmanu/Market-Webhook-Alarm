{% extends 'base.html' %}{% block content %}<div class="panel loginbox"><div class="brand"><div class="brandmark">M</div><div><h1>Create account</h1><div class="muted">Private alerts and webhook destinations</div></div></div><form method="post" style="margin-top:22px"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><div style="margin-bottom:12px"><label>Account-creation password</label><input type="password" name="invite_password" required autocomplete="off"><div class="help">Use the shared ADMIN_PASSWORD configured by the site owner.</div></div><div style="margin-bottom:16px"><label>Create your personal password (10+ characters)</label><input type="password" name="password" required minlength="10" autocomplete="new-password"></div><button style="width:100%">Create my account</button></form><p class="muted" style="margin-top:16px"><a href="/login" style="color:var(--blue)">Back to sign in</a></p></div>{% endblock %}
